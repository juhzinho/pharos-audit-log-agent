<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pharos Ledger</title>
  <meta name="description" content="Audit log and weekly digest for Pharos Pacific. Chain MCP. Read-only." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    (function () {
      var saved = localStorage.getItem("pharos-theme");
      var theme = saved === "dark" || saved === "light" ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <style>
    :root, html[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff; --elev: #f6f7f9; --card: #f7f8fa; --ink: #111111; --muted: #6b7280;
      --line: #ececee; --line-2: #d9dbe0;
      --brand: #0033ff; --brand-soft: #eef1ff;
      --ok: #0a7d4f; --ok-soft: #e7f6ef; --warn: #c4312a; --warn-soft: #fdecea;
      --gold: #9a5b00; --gold-soft: #fff4e5;
      --surface: #ffffff; --chip: #111111; --chip-ink: #ffffff; --bar: #e6e8ee;
      --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
      --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0c0e14; --elev: #171a22; --card: #151821; --ink: #f4f6fb; --muted: #9aa3b5;
      --line: #262a36; --line-2: #343946;
      --brand: #6d86ff; --brand-soft: #1c2558;
      --ok: #3dce8a; --ok-soft: #123226; --warn: #ff6b64; --warn-soft: #3a1818;
      --gold: #e0a15a; --gold-soft: #3a2a14;
      --surface: #10131a; --chip: #f4f6fb; --chip-ink: #111318; --bar: #2a2f3c;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; font: 15px/1.55 var(--sans); color: var(--ink); background: var(--bg); }
    a { color: var(--brand); }
    .top {
      position: sticky; top: 0; z-index: 20; background: var(--bg);
      display: flex; align-items: center; gap: 18px;
      padding: 16px 40px; border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; gap: 10px; align-items: center; color: inherit; text-decoration: none; }
    .logo { width: 22px; height: 22px; flex: none; }
    .brand .word { display: flex; align-items: baseline; gap: 8px; }
    .brand b { font-size: 14px; letter-spacing: .12em; font-weight: 800; }
    .brand em { font-style: normal; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .1em; }
    nav.tabs { display: flex; flex: 1; gap: 6px; justify-content: center; }
    nav.tabs a {
      display: inline-flex; padding: 8px 14px; border-radius: 999px; color: var(--ink); text-decoration: none;
      font-size: 13px; font-weight: 600; border: 1px solid var(--line-2); background: var(--surface);
    }
    nav.tabs a.on { color: var(--chip-ink); background: var(--chip); border-color: var(--chip); }
    .delta.up { color: var(--ok); } .delta.down { color: var(--warn); } .delta.flat { color: var(--muted); }
    .tools { display: flex; gap: 8px; margin-left: auto; align-items: center; }
    .lang { display: flex; }
    .lang button {
      border: 1px solid var(--line-2); background: var(--surface); color: var(--muted);
      padding: 7px 12px; cursor: pointer; font: 600 12px var(--sans);
    }
    .lang button:first-child { border-radius: 999px 0 0 999px; }
    .lang button:last-child { border-radius: 0 999px 999px 0; border-left: 0; }
    .lang button.on { background: var(--chip); color: var(--chip-ink); border-color: var(--chip); }
    main { max-width: 1180px; margin: 0 auto; padding: 48px 40px 20px; }
    .hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; padding: 8px 0 8px; }
    .kicker { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
    .kicker::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--brand); }
    .hero h1 { font-size: clamp(40px, 6vw, 68px); line-height: .95; text-transform: uppercase; letter-spacing: -.04em; margin: 0; color: var(--brand); }
    .lead { color: var(--muted); margin: 0; max-width: 36ch; font-size: 15px; line-height: 1.6; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 22px; }
    .filter { border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
    .tile {
      display: flex; flex-direction: column; gap: 12px; min-height: 210px;
      background: var(--card); border: 0; border-radius: 8px; padding: 22px 22px 18px;
      color: inherit; text-decoration: none;
    }
    .tile.on { outline: 2px solid var(--brand); }
    .cat { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .cat i { width: 7px; height: 7px; border-radius: 2px; background: var(--brand); display: inline-block; }
    .tile h3 { margin: 8px 0 0; font-size: 20px; letter-spacing: -.02em; font-weight: 800; text-transform: uppercase; line-height: 1.15; }
    .tile p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
    .tile-foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
    .tile-foot b { color: var(--ink); }
    .card { background: var(--card); border-radius: 8px; padding: 22px; margin-bottom: 16px; }
    .card h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); margin: 0 0 14px; }
    label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .08em; }
    input, select {
      width: 100%; padding: 11px 12px; border: 1px solid var(--line-2); border-radius: 999px;
      font: inherit; color: var(--ink); background: var(--surface); color-scheme: inherit;
    }
    input.mono, select { font-family: var(--mono); font-size: 13px; }
    select { font-family: var(--sans); }
    input:focus { outline: 2px solid #c9d2ff; border-color: var(--brand); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 140px; }
    .btn {
      margin-top: 14px; padding: 12px 16px; border: 0; border-radius: 999px;
      background: var(--brand); color: #fff; font: 600 14px var(--sans); cursor: pointer;
    }
    .btn:disabled { opacity: .5; cursor: progress; }
    .btn.ghost { background: var(--chip); color: var(--chip-ink); }
    .btn.line { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .actions .btn { margin: 0; }
    .status { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 20px; }
    .status.err { color: var(--warn); }
    .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
    .pill { display: inline-flex; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; background: var(--surface); border: 1px solid var(--line-2); }
    .kind { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 7px; background: var(--surface); color: var(--muted); text-transform: uppercase; }
    .kind.in { background: var(--ok-soft); color: var(--ok); }
    .kind.out { background: var(--warn-soft); color: var(--warn); }
    .kind.swap { background: var(--brand-soft); color: var(--brand); }
    .kind.approval { background: var(--gold-soft); color: var(--gold); }
    .kind.self { background: var(--elev); color: var(--ink); }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 6px 8px 6px 0; font-weight: 600; }
    td { padding: 8px 8px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
    .addr { font-family: var(--mono); font-size: 12.5px; word-break: break-all; color: var(--ink); }
    .note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
    .brief p { margin: 0 0 8px; }
    .finding { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .sev { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; border-radius: 6px; padding: 2px 7px; text-transform: uppercase; }
    .sev.high { background: var(--warn-soft); color: var(--warn); }
    .sev.info { background: var(--elev); color: var(--muted); }
    .stance { display: inline-block; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 4px 12px; background: var(--brand-soft); color: var(--brand); font-size: 12px; }
    .bar { height: 6px; background: var(--bar); border-radius: 99px; margin-top: 12px; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; background: var(--brand); }
    .scroll { overflow-x: auto; }
    footer { color: var(--muted); font-size: 13px; padding: 8px 40px 48px; max-width: 1180px; margin: 0 auto; }
    [hidden] { display: none !important; }
    @media print {
      .top, .filters, .board, form, .actions, footer, .no-print { display: none !important; }
      main { padding: 0; }
      .card { break-inside: avoid; }
    }
    @media (max-width: 980px) {
      .top { padding: 12px 16px; }
      .brand em { display: none; }
      main { padding: 28px 16px 16px; }
      footer { padding: 8px 16px 32px; }
      .hero { flex-direction: column; align-items: flex-start; gap: 12px; }
      .lead { max-width: none; }
      .board { grid-template-columns: 1fr; }
      .hero h1 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="#home">
      <svg class="logo" viewBox="0 0 34 34" fill="none" aria-hidden="true">
        <rect width="34" height="34" rx="8" fill="#0033ff"/>
        <path d="M10 24V11.2h8.4c2.7 0 4.4 1.6 4.4 4 0 1.7-.9 3-2.4 3.6L23.4 24h-3.2l-2.7-5H13.2V24H10zm3.2-7.8h5c1.2 0 1.9-.6 1.9-1.5s-.7-1.5-1.9-1.5h-5v3z" fill="#fff"/>
      </svg>
      <span class="word"><b>PHAROS</b><em>LEDGER</em></span>
    </a>
    <nav class="tabs">
      <a href="#audit" data-tab="audit">Audit</a>
      <a href="#digest" data-tab="digest">Digest</a>
    </nav>
    <div class="tools">
      <div class="lang" id="theme"><button type="button" data-theme="light"></button><button type="button" data-theme="dark"></button></div>
      <div class="lang"><button data-lang="en">EN</button><button data-lang="pt">PT</button></div>
    </div>
  </header>
  <main>
    <div class="hero">
      <div>
        <p class="kicker">Agent Arena</p>
        <h1 id="title"></h1>
      </div>
      <p class="lead" id="lead"></p>
    </div>
    <div class="filters">
      <span class="filter" data-i18n="fChain"></span>
      <span class="filter" data-i18n="fRead"></span>
      <span class="filter">1672</span>
    </div>
    <div class="board" data-panel="home">
      <a class="tile" href="#audit">
        <div class="tile-top"><span class="cat"><i></i>Chain MCP</span><span class="cat">07</span></div>
        <h3 id="tileTitle"></h3>
        <p id="tileBlurb"></p>
        <div class="tile-foot"><span></span><b id="tileOpen"></b></div>
      </a>
      <a class="tile" href="#digest">
        <div class="tile-top"><span class="cat"><i></i>Chain MCP</span><span class="cat">08</span></div>
        <h3 id="digestTileTitle"></h3>
        <p id="digestTileBlurb"></p>
        <div class="tile-foot"><span></span><b id="digestTileOpen"></b></div>
      </a>
    </div>

    <section class="card" data-panel="audit" id="audit">
      <h2 data-i18n="formTitle"></h2>
      <form id="form">
        <label for="wallet" data-i18n="walletLabel"></label>
        <input class="mono" id="wallet" autocomplete="off" spellcheck="false" value="0x912c9aDe24D44d8922f0866D8Dcb079f1363f647" />
        <label for="span" data-i18n="spanLabel"></label>
        <select id="span">
          <option value="1" data-i18n="span1"></option>
          <option value="6" data-i18n="span6"></option>
          <option value="24" data-i18n="span24"></option>
          <option value="custom" data-i18n="spanCustom"></option>
        </select>
        <div class="row" id="dates" hidden>
          <div>
            <label for="from" data-i18n="fromLabel"></label>
            <input id="from" type="date" />
          </div>
          <div>
            <label for="to" data-i18n="toLabel"></label>
            <input id="to" type="date" />
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="go" type="submit" data-i18n="go"></button>
          <button class="btn line" id="stop" type="button" hidden data-i18n="stop"></button>
        </div>
      </form>
      <p class="status" id="status"></p>
      <div class="bar" id="bar" hidden><span id="barFill"></span></div>
    </section>

    <section class="card" data-panel="digest">
      <h2 data-i18n="digestForm"></h2>
      <form id="digestForm">
        <label for="digestWallet" data-i18n="walletLabel"></label>
        <input class="mono" id="digestWallet" autocomplete="off" spellcheck="false" value="0x912c9aDe24D44d8922f0866D8Dcb079f1363f647" />
        <div class="actions">
          <button class="btn" id="digestGo" type="submit" data-i18n="digestBtn"></button>
          <button class="btn line" id="digestStop" type="button" hidden data-i18n="stop"></button>
        </div>
      </form>
      <p class="status" id="digestStatus"></p>
      <div class="bar" id="digestBar" hidden><span id="digestBarFill"></span></div>
    </section>
    <section class="card" data-panel="digest" id="digestOut" hidden>
      <h2 data-i18n="digestReport"></h2>
      <p id="digestStory" class="brief"></p>
      <div class="stats" id="digestMetrics"></div>
      <p class="note" id="digestNet"></p>
      <p class="note" id="digestWindows"></p>
      <p class="note" id="digestNote"></p>
      <p class="note" id="digestVenues"></p>
      <div class="stats" id="digestHold"></div>
      <div class="row">
        <div>
          <h2 data-i18n="inTitle"></h2>
          <div id="digestIn"></div>
          <p class="note" id="digestInThen"></p>
        </div>
        <div>
          <h2 data-i18n="outTitle"></h2>
          <div id="digestOutMoney"></div>
          <p class="note" id="digestOutThen"></p>
        </div>
      </div>
    </section>
    <section class="card" data-panel="digest" id="digestTopCard" hidden>
      <h2 data-i18n="digestTop"></h2>
      <div class="scroll"><table><thead><tr id="digestHead"></tr></thead><tbody id="digestTop"></tbody></table></div>
      <p class="note" id="digestMeta"></p>
    </section>

    <section class="card" data-panel="audit" id="briefCard" hidden>
      <h2 data-i18n="briefTitle"></h2>
      <p><span class="stance" id="stance"></span></p>
      <div class="brief" id="briefText"></div>
      <div id="findings"></div>
      <div class="stats" id="holdings"></div>
    </section>

    <section class="card" data-panel="audit" id="partyCard" hidden>
      <h2 data-i18n="partyTitle"></h2>
      <div class="scroll"><table><thead><tr id="head0"></tr></thead><tbody id="parties"></tbody></table></div>
    </section>

    <section class="card" data-panel="audit" id="out" hidden>
      <h2 data-i18n="reportTitle"></h2>
      <p id="walletLine"></p>
      <div class="stats" id="counts"></div>
      <p class="note" id="note"></p>
      <div class="row">
        <div>
          <h2 data-i18n="inTitle"></h2>
          <div id="incoming"></div>
        </div>
        <div>
          <h2 data-i18n="outTitle"></h2>
          <div id="outgoing"></div>
        </div>
      </div>
      <div class="actions no-print">
        <button class="btn ghost" id="md" type="button">Markdown</button>
        <button class="btn ghost" id="csv" type="button">CSV</button>
        <button class="btn line" id="pdf" type="button" data-i18n="pdf"></button>
      </div>
    </section>

    <section class="card" data-panel="audit" id="notableCard" hidden>
      <h2 data-i18n="notableTitle"></h2>
      <div class="scroll"><table><thead><tr id="head1"></tr></thead><tbody id="notable"></tbody></table></div>
    </section>

    <section class="card" data-panel="audit" id="itemsCard" hidden>
      <h2 data-i18n="itemsTitle"></h2>
      <div class="scroll"><table><thead><tr id="head2"></tr></thead><tbody id="items"></tbody></table></div>
      <p class="meta note" id="meta"></p>
    </section>
  </main>
  <footer id="foot"></footer>

        outTitle: "Totais de saída",
        none: "nenhum",
        notableTitle: "Destaques",
        itemsTitle: "Atividade",
        pdf: "Imprimir / PDF",
        cats: { in: "Entrada", out: "Saída", self: "Própria", swap: "Swap", approval: "Aprovação" },
        why: { "unlimited-approval": "Aprovação ilimitada", swap: "Dois tokens oficiais na mesma tx", size: "Maior valor" },
        cols: ["Categoria", "Bloco", "Detalhe", "Tx"],
        light: "Claro", dark: "Escuro",
        foot: `Pacific Mainnet (1672) · <a href="https://mcp.pharos.xyz/mcp">Chain MCP</a> · Somente leitura: sem carteira nem chave. · <a href="https://pharos-agent-arena.vercel.app/">Agent Arena</a>`,
      },
    };

    const $ = (id) => document.getElementById(id);
    const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const shortHex = (v) => v ? `${v.slice(0, 6)}…${v.slice(-4)}` : "";
    let lang = localStorage.getItem("pharos-lang") || (navigator.language?.startsWith("pt") ? "pt" : "en");
    let lastReport = null;
    let lastDigest = null;
    let scanGen = 0;
    let digestGen = 0;
    let tab = "home";
    const savedWallet = localStorage.getItem("pharos-wallet");
    if (savedWallet) {
      $("wallet").value = savedWallet;
      $("digestWallet").value = savedWallet;
    }
    function rememberWallet(addr) {
      const v = String(addr || "").trim();
      if (!v) return;
      localStorage.setItem("pharos-wallet", v);
      $("wallet").value = v;
      $("digestWallet").value = v;
    }

    function iso(d) {
      return d.toISOString().slice(0, 10);
    }

    function applyText() {
      const t = I18N[lang];
      document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
      document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t[el.dataset.i18n] || ""));
      document.querySelectorAll(".lang button[data-lang]").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
      paintTheme();
      $("title").textContent = tab === "digest" ? t.digestTitle : t.title;
      $("lead").textContent = tab === "digest" ? t.digestLead : t.lead;
      $("tileTitle").textContent = t.tileTitle;
      $("tileBlurb").textContent = t.tileBlurb;
      $("tileOpen").textContent = t.tileOpen;
      $("digestTileTitle").textContent = t.digestTileTitle;
      $("digestTileBlurb").textContent = t.digestTileBlurb;
      $("digestTileOpen").textContent = t.tileOpen;
      $("foot").innerHTML = t.foot;
      $("head0").innerHTML = t.partyCols.map((c) => `<th>${c}</th>`).join("");
      $("head1").innerHTML = t.cols.map((c) => `<th>${c}</th>`).join("");
      $("head2").innerHTML = t.cols.map((c) => `<th>${c}</th>`).join("");
      $("digestHead").innerHTML = t.cols.map((c) => `<th>${c}</th>`).join("");
      if (lastReport && tab === "audit") render(lastReport);
      if (lastDigest && tab === "digest") renderDigest(lastDigest);
    }

    function showTab(name) {
      tab = name === "digest" ? "digest" : name === "audit" ? "audit" : "home";
      document.querySelectorAll("[data-panel]").forEach((el) => {
        el.hidden = el.dataset.panel !== tab;
      });
      document.querySelectorAll("nav.tabs a").forEach((a) => a.classList.toggle("on", a.dataset.tab === tab));
      applyText();
      if (tab === "digest" && !lastDigest) loadDigest();
    }

    function formatAmount(raw, decimals = 18, maxFraction = 6) {
      if (raw == null || raw === "") return "";
      const group = lang === "en" ? "," : ".";
      const decimal = lang === "en" ? "." : ",";
      let x;
      try { x = BigInt(raw); } catch { return String(raw); }
      const sign = x < 0n ? "-" : "";
      if (x < 0n) x = -x;
      const dec = Number.isInteger(decimals) ? decimals : 18;
      const base = 10n ** BigInt(dec);
      const ip = (x / base).toString();
      const fp = (x % base).toString().padStart(dec, "0");
      const grouped = ip.replace(/\B(?=(\d{3})+(?!\d))/g, group);
      const fraction = fp.slice(0, maxFraction).replace(/0+$/, "");
      if (!fraction && /[1-9]/.test(fp) && ip === "0") {
        return `${sign}< 0${decimal}${"0".repeat(Math.max(maxFraction - 1, 0))}1`;
      }
      return sign + grouped + (fraction ? `${decimal}${fraction}` : "");
    }

    function detail(row) {
      const legs = (row.legs || []).map((l) => {
        const amt = l.raw != null ? formatAmount(l.raw, l.decimals, 4) : (l[lang] || l.amount);
        const other = l.direction === "in" ? (l.fromLabel || "") : l.direction === "out" ? (l.toLabel || "") : "";
        const extra = other && !/USDC|USDCe|WPROS|LINK|WETH/i.test(other) ? ` · ${other}` : "";
        return `${I18N[lang].cats[l.direction] || l.direction} ${amt} ${l.symbol}${extra}`;
      }).join(" · ");
      const appr = (row.approvals || []).map((a) => {
        const amt = a.raw != null && !/^unlimited|ilimitada$/i.test(String(a.amount))
          ? formatAmount(a.raw, a.decimals, 4)
          : (lang === "pt" && String(a.amount) === "unlimited" ? "ilimitada" : lang === "en" && String(a.amount) === "ilimitada" ? "unlimited" : a.amount);
        return `${a.symbol} → ${shortHex(a.spender)} (${amt})`;
      }).join(" · ");
      return [legs, appr].filter(Boolean).join(" · ");
    }

    function rowHtml(row, extra) {
      const loc = lang === "pt" ? "pt-BR" : "en-US";
      return `<tr>
        <td><span class="kind ${escapeHtml(row.category)}">${escapeHtml(I18N[lang].cats[row.category] || row.category)}</span></td>
        <td>${Number(row.block).toLocaleString(loc)}</td>
        <td>${escapeHtml(extra || detail(row))}</td>
        <td><a class="addr" href="${escapeHtml(row.txUrl)}" target="_blank" rel="noopener">${shortHex(row.tx)}</a></td>
      </tr>`;
    }

    function moneyList(rows) {
      const t = I18N[lang];
      if (!rows?.length) return `<span class="note">${t.none}</span>`;
      return `<div class="stats">${rows.map((r) => {
        const amt = r.raw != null ? formatAmount(r.raw, r.decimals ?? 18, 4) : (r[lang] || r.amount);
        return `<span class="pill">${escapeHtml(amt)} ${escapeHtml(r.symbol)}</span>`;
      }).join("")}</div>`;
    }

    function moneyThenLine(rows) {
      const t = I18N[lang];
      if (!rows?.length) return `${t.digestThen}: ${t.none}`;
      return `${t.digestThen}: ` + rows.map((r) => {
        const amt = r.raw != null ? formatAmount(r.raw, r.decimals ?? 18, 4) : (r[lang] || r.amount);
        return `${amt} ${r.symbol}`;
      }).join(" · ");
    }

    function windowLine(data) {
      const t = I18N[lang];
      const loc = lang === "pt" ? "pt-BR" : "en-US";
      const fmt = (n) => Number(n).toLocaleString(loc);
      const cur = data.windows?.current || data.current || {};
      const prev = data.windows?.previous || data.previous || {};
      const one = (label, w) => {
        const blocks = w.fromBlock != null ? `${fmt(w.fromBlock)}–${fmt(w.toBlock)}` : "";
        const when = [w.fromTime, w.toTime].filter(Boolean).join(" → ");
        return `${label}: ${blocks}${when ? ` · ${when}` : ""}`;
      };
      return [one(t.digestNowWin, cur), one(t.digestThenWin, prev)].filter(Boolean).join("  |  ");
    }

    function render(data) {
      const t = I18N[lang];
      const loc = lang === "pt" ? "pt-BR" : "en-US";
      const brief = data.brief;
      $("briefCard").hidden = !brief;
      if (brief) {
        $("stance").textContent = brief.stanceLabel?.[lang] || brief.stance || "";
        $("briefText").innerHTML = (brief.paragraphs?.[lang] || []).map((p) => `<p>${escapeHtml(p)}</p>`).join("");
        $("findings").innerHTML = (brief.findings || []).map((f) => `<div class="finding"><span class="sev ${escapeHtml(f.severity)}">${escapeHtml(f.severity)}</span><span>${escapeHtml(f[lang] || f.en)}</span></div>`).join("");
        const holds = (data.context?.balances || []).filter((b) => {
          try { return BigInt(b.raw ?? 0) > 0n; } catch { return b.amount && b.amount !== "0"; }
        }).map((b) => `<span class="pill">${escapeHtml(b.amount)} ${escapeHtml(b.symbol)}</span>`).join("");
        const nativeZero = data.context?.nativeRaw != null && BigInt(data.context.nativeRaw) === 0n;
        const pros = data.context?.native && !nativeZero ? `<span class="pill">${escapeHtml(data.context.native)} PROS</span>` : "";
        $("holdings").innerHTML = holds || pros ? `<span class="note">${escapeHtml(t.holds)}</span>${pros}${holds}` : "";
      }
      const parties = brief?.counterparties || [];
      $("partyCard").hidden = !parties.length;
      $("parties").innerHTML = parties.map((p) => `<tr>
        <td><a class="addr" href="https://www.pharosscan.xyz/address/${escapeHtml(p.address)}" target="_blank" rel="noopener">${escapeHtml(p.name?.[lang] || shortHex(p.address))}</a></td>
        <td>${p.txCount}</td>
        <td>${escapeHtml(p[lang] || p.en)}</td>
      </tr>`).join("");
      $("out").hidden = false;
      $("walletLine").innerHTML = `<a class="addr" href="${escapeHtml(data.walletUrl)}" target="_blank" rel="noopener">${escapeHtml(data.wallet)}</a>
        · ${escapeHtml(data.range.from)} → ${escapeHtml(data.range.to)}
        · ${Number(data.fromBlock).toLocaleString(loc)} → ${Number(data.toBlock).toLocaleString(loc)}`;
      $("counts").innerHTML = ["in", "out", "self", "swap", "approval"]
        .map((k) => `<span class="pill"><span class="kind ${k}">${escapeHtml(t.cats[k])}</span> ${data.counts?.[k] ?? 0}</span>`)
        .join("");
      $("note").textContent = data.note || "";
      $("incoming").innerHTML = moneyList(data.incoming);
      $("outgoing").innerHTML = moneyList(data.outgoing);
      $("notableCard").hidden = !(data.notable || []).length;
      $("notable").innerHTML = (data.notable || []).map((n) => rowHtml(n, `${detail(n)} — ${t.why[n.why] || n.why}`)).join("");
      $("itemsCard").hidden = false;
      const rows = data.items || [];
      $("items").innerHTML = rows.map((n) => rowHtml(n)).join("") || `<tr><td colspan="4">${escapeHtml(t.none)}</td></tr>`;
      const ms = data.ms != null ? ` · ${(data.ms / 1000).toFixed(1)}s` : "";
      $("meta").textContent = `${data.calls || "Chain MCP"}${ms}`;
      $("status").textContent = "";
    }

    async function getJson(url, tries = 4) {
      let last = "Pharos MCP";
      for (let i = 0; i < tries; i++) {
        const res = await fetch(url);
        const data = await res.json().catch(() => ({ ok: false, error: `HTTP ${res.status}` }));
        if ((res.status === 504 || res.status === 502 || res.status === 503) && i < tries - 1) {
          last = data.error || I18N[lang].digestTimeout || last;
          await new Promise((r) => setTimeout(r, 3000 * (i + 1)));
          continue;
        }
        if (!data.ok) throw new Error(data.error || (res.status === 504 ? I18N[lang].digestTimeout : `HTTP ${res.status}`));
        return data;
      }
      throw new Error(last);
    }

    function saveFile(name, text, type) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type }));
      a.download = name;
      a.click();
    }

    async function run(e) {
      e?.preventDefault();
      const gen = ++scanGen;
      const wallet = $("wallet").value.trim();
      rememberWallet(wallet);
      const q = new URLSearchParams({ step: "prepare", wallet, lang });
      if ($("span").value === "custom") {
        if ($("from").value) q.set("from", $("from").value);
        if ($("to").value) q.set("to", $("to").value);
      } else q.set("hours", $("span").value);
      $("go").disabled = true;
      $("stop").hidden = false;
      $("status").className = "status";
      $("status").textContent = I18N[lang].busy;
      $("bar").hidden = false;
      $("barFill").style.width = "0%";
      const loc = lang === "pt" ? "pt-BR" : "en-US";
      try {
        const prepared = await getJson(`/api/audit?${q}`);
        if (gen !== scanGen) return;
        const span = Math.max(1, prepared.toBlock - prepared.fromBlock + 1);
        const slices = [];
        for (let start = prepared.fromBlock; start <= prepared.toBlock; start += prepared.chunk) {
          slices.push([start, Math.min(start + prepared.chunk - 1, prepared.toBlock)]);
        }
        slices.reverse();
        const items = [];
        let covered = 0;
        let next = 0;
        const started = Date.now();
        $("status").textContent = I18N[lang].scanning("0", span.toLocaleString(loc), 0, prepared.etaMin);
        async function pullSlice() {
          while (next < slices.length) {
            if (gen !== scanGen) return;
            const [start, end] = slices[next++];
            const slice = await getJson(`/api/audit?${new URLSearchParams({ step: "slice", wallet: prepared.wallet, fromBlock: String(start), toBlock: String(end), lang })}`);
            if (gen !== scanGen) return;
            items.push(...(slice.items || []));
            covered += end - start + 1;
            const elapsed = Date.now() - started;
            const left = Math.max(1, Math.round(((span - covered) * (elapsed / Math.max(covered, 1))) / 60000));
            $("barFill").style.width = `${Math.min(100, Math.round((covered / span) * 100))}%`;
            $("status").textContent = I18N[lang].scanning(covered.toLocaleString(loc), span.toLocaleString(loc), items.length, left);
          }
        }
        await Promise.all([pullSlice(), pullSlice()]);
        if (gen !== scanGen) return;
        $("status").textContent = I18N[lang].reading;
        const res = await fetch("/api/audit", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            wallet: prepared.wallet,
            range: prepared.range,
            fromBlock: prepared.fromBlock,
            toBlock: prepared.toBlock,
            headBlock: prepared.headBlock,
            context: lang === "pt" ? prepared.contextPt : prepared.context,
            items,
            lang,
          }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || `HTTP ${res.status}`);
        lastReport = data;
        $("barFill").style.width = "100%";
        render(data);
      } catch (err) {
        if (gen !== scanGen) return;
        $("status").className = "status err";
        $("status").textContent = err.message;
      } finally {
        if (gen === scanGen) {
          $("go").disabled = false;
          $("stop").hidden = true;
        }
      }
    }

    function changeLabel(n) {
      if (n == null) return lang === "pt" ? "novo" : "new";
      if (n === 0) return "0%";
      return `${n > 0 ? "+" : ""}${n}%`;
    }

    function renderDigest(data) {
      const t = I18N[lang];
      lastDigest = data;
      $("digestOut").hidden = false;
      $("digestStory").textContent = data.story?.[lang] || data.story?.en || "";
      $("digestNote").textContent = data.notes?.[lang] || data.note || "";
      $("digestWindows").textContent = windowLine(data);
      const labels = { events: t.metricEvents, swaps: t.metricSwaps, in: t.metricIn, out: t.metricOut };
      $("digestMetrics").innerHTML = (data.metrics || []).map((m) => {
        const cls = m.change == null || m.change > 0 ? "up" : m.change < 0 ? "down" : "flat";
        return `<span class="pill">${escapeHtml(labels[m.id] || m.id)} ${m.now} vs ${m.then} <span class="delta ${cls}">${changeLabel(m.change)}</span></span>`;
      }).join("");
      $("digestIn").innerHTML = moneyList(data.incoming);
      $("digestOutMoney").innerHTML = moneyList(data.outgoing);
      $("digestInThen").textContent = moneyThenLine(data.incomingThen);
      $("digestOutThen").textContent = moneyThenLine(data.outgoingThen);
      $("digestTopCard").hidden = !(data.top || []).length;
      $("digestNet").textContent = (data.net || []).length
        ? `${t.netTitle}: ${data.net.map((r) => `${r[lang] || r.amount} ${r.symbol}`).join(" · ")}`
        : "";
      $("digestVenues").textContent = "";
      const holds = (data.holdings?.balances || []).filter((b) => {
        try { return BigInt(b.raw ?? 0) > 0n; } catch { return false; }
      });
      const nativeRaw = data.holdings?.nativeRaw;
      const native = nativeRaw != null && BigInt(nativeRaw) > 0n ? formatAmount(nativeRaw, 18, 4) : "";
      $("digestHold").innerHTML = (native || holds.length)
        ? `<span class="note">${escapeHtml(t.holds)}</span>${native ? `<span class="pill">${escapeHtml(native)} PROS</span>` : ""}${holds.map((b) => {
          const amt = b.raw != null ? formatAmount(b.raw, b.decimals ?? 18, 4) : b.amount;
          return `<span class="pill">${escapeHtml(amt)} ${escapeHtml(b.symbol)}</span>`;
        }).join("")}`
        : "";
      $("digestTop").innerHTML = (data.top || []).map((n) => {
        const d = detail(n);
        const via = n.via && !d.includes(n.via) ? ` · ${n.via}` : "";
        return rowHtml(n, `${d} — ${t.why[n.why] || n.why}${via}`);
      }).join("");
      const ms = data.ms != null ? ` · ${(data.ms / 1000).toFixed(1)}s` : "";
      $("digestMeta").textContent = `${data.calls || "Chain MCP"}${ms}`;
      $("digestStatus").textContent = "";
    }

    async function loadDigest(e) {
      e?.preventDefault();
      const gen = ++digestGen;
      const wallet = $("digestWallet").value.trim();
      rememberWallet(wallet);
      $("digestGo").disabled = true;
      $("digestStop").hidden = false;
      $("digestStatus").className = "status";
      $("digestStatus").textContent = I18N[lang].digestBusy;
      $("digestBar").hidden = false;
      $("digestBarFill").style.width = "0%";
      const loc = lang === "pt" ? "pt-BR" : "en-US";
      const started = Date.now();
      try {
        const prepared = await getJson(`/api/digest?${new URLSearchParams({ step: "prepare", wallet, lang })}`);
        if (gen !== digestGen) return;
        const ranges = [prepared.windows.current, prepared.windows.previous];
        const slices = [];
        for (const w of ranges) {
          for (let start = w.fromBlock; start <= w.toBlock; start += prepared.chunk) {
            slices.push([start, Math.min(start + prepared.chunk - 1, w.toBlock), w === prepared.windows.current ? "now" : "then"]);
          }
        }
        slices.reverse();
        const span = Math.max(1, slices.reduce((n, [a, b]) => n + (b - a + 1), 0));
        const currentItems = [];
        const previousItems = [];
        let covered = 0;
        let next = 0;
        $("digestStatus").textContent = I18N[lang].digestScan("0", span.toLocaleString(loc), 0);
        async function pull() {
          while (next < slices.length) {
            if (gen !== digestGen) return;
            const [start, end, which] = slices[next++];
            const slice = await getJson(`/api/digest?${new URLSearchParams({ step: "slice", wallet: prepared.wallet, fromBlock: String(start), toBlock: String(end), lang })}`);
            if (gen !== digestGen) return;
            const bag = which === "now" ? currentItems : previousItems;
            bag.push(...(slice.items || []));
            covered += end - start + 1;
            $("digestBarFill").style.width = `${Math.min(100, Math.round((covered / span) * 100))}%`;
            $("digestStatus").textContent = I18N[lang].digestScan(covered.toLocaleString(loc), span.toLocaleString(loc), currentItems.length + previousItems.length);
          }
        }
        await Promise.all([pull(), pull()]);
        if (gen !== digestGen) return;
        const res = await fetch("/api/digest", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            wallet: prepared.wallet,
            windows: prepared.windows,
            currentItems,
            previousItems,
            context: lang === "pt" ? prepared.contextPt : prepared.context,
            lang,
            days: prepared.days,
            headBlock: prepared.headBlock,
            blockSeconds: prepared.blockSeconds,
          }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || `HTTP ${res.status}`);
        if (gen !== digestGen) return;
        data.ms = Date.now() - started;
        data.calls = data.calls || "Chain MCP";
        $("digestBarFill").style.width = "100%";
        renderDigest(data);
        history.replaceState(null, "", `#digest`);
      } catch (err) {
        if (gen !== digestGen) return;
        $("digestStatus").className = "status err";
        $("digestStatus").textContent = err.message;
      } finally {
        if (gen === digestGen) {
          $("digestGo").disabled = false;
          $("digestStop").hidden = true;
          $("digestBar").hidden = true;
        }
      }
    }

    function download(format) {
      if (!lastReport) return;
      if (format === "md") saveFile("audit.md", lastReport.markdown || "", "text/markdown");
      else saveFile("audit.csv", lastReport.csv || "", "text/csv");
    }

    const today = new Date();
    $("to").value = iso(today);
    $("from").value = iso(today);
    function paintTheme() {
      const theme = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
      document.querySelectorAll("#theme button").forEach((b) => {
        b.textContent = I18N[lang][b.dataset.theme];
        b.classList.toggle("on", b.dataset.theme === theme);
      });
    }

    document.querySelectorAll("#theme button").forEach((b) => b.addEventListener("click", () => {
      document.documentElement.dataset.theme = b.dataset.theme;
      localStorage.setItem("pharos-theme", b.dataset.theme);
      paintTheme();
    }));
    document.querySelectorAll(".lang button[data-lang]").forEach((b) => b.addEventListener("click", () => {
      lang = b.dataset.lang;
      localStorage.setItem("pharos-lang", lang);
      applyText();
    }));
    $("span").onchange = () => { $("dates").hidden = $("span").value !== "custom"; };
    $("stop").onclick = () => {
      scanGen++;
      $("go").disabled = false;
      $("stop").hidden = true;
      $("status").className = "status";
      $("status").textContent = I18N[lang].stopped;
    };
    $("digestStop").onclick = () => {
      digestGen++;
      $("digestGo").disabled = false;
      $("digestStop").hidden = true;
      $("digestBar").hidden = true;
      $("digestStatus").className = "status";
      $("digestStatus").textContent = I18N[lang].stopped;
    };
    $("form").onsubmit = run;
    $("digestForm").onsubmit = loadDigest;
    window.addEventListener("hashchange", () => showTab(location.hash.slice(1)));
    $("md").onclick = () => download("md");
    $("csv").onclick = () => download("csv");
    $("pdf").onclick = () => window.print();
    showTab(location.hash.slice(1) || "home");
  </script>
</body>
</html>
